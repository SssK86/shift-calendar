<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>交番表シフトカレンダー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    .container {
      background: #fff;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    label {
      font-weight: bold;
      margin-right: 6px;
    }

    input, button {
      padding: 8px;
      margin: 5px 0 10px 0;
      font-size: 14px;
      box-sizing: border-box;
    }

    input[type="number"],
    input[type="date"] {
      width: 180px;
      max-width: 100%;
    }

    button {
      cursor: pointer;
      background: #1976d2;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    button:hover {
      background: #125ca1;
    }

    .secondary {
      background: #666;
    }

    .secondary:hover {
      background: #4d4d4d;
    }

    .success {
      background: #2e7d32;
    }

    .success:hover {
      background: #1f5a22;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      min-width: 180px;
      flex: 1 1 180px;
    }

    .summary {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.8;
    }

    .error {
      color: #c62828;
      font-weight: bold;
      margin-top: 10px;
    }

    .notice {
      color: #555;
      font-size: 13px;
      margin-top: 6px;
      line-height: 1.6;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      background: #ccc;
      border: 1px solid #ccc;
    }

    .cell {
      background: #fff;
      min-height: 96px;
      padding: 6px;
      font-size: 14px;
    }

    .header {
      background: #eceff1;
      text-align: center;
      font-weight: bold;
      min-height: auto;
    }

    .day {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .shift {
      display: inline-block;
      margin-top: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      line-height: 1.4;
      word-break: break-word;
    }

    .route {
      background: #d0e7ff;
      color: #0d47a1;
    }

    .ake {
      background: #fff3cd;
      color: #7a5600;
    }

    .off {
      background: #d4f5d4;
      color: #1b5e20;
    }

    .blank {
      background: #fafafa;
    }

    .note {
      margin-top: 4px;
      font-size: 11px;
      color: #666;
      line-height: 1.3;
    }

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
      font-size: 13px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-route { background: #d0e7ff; }
    .dot-ake { background: #fff3cd; }
    .dot-off { background: #d4f5d4; }

    .top-actions {
      margin-top: 10px;
    }

    .pattern-preview {
      margin-top: 14px;
      padding: 12px;
      background: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 220px;
      overflow: auto;
    }

    .export-info {
      margin-top: 12px;
      padding: 12px;
      background: #eef7ee;
      border: 1px solid #c7e0c8;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 700px) {
      body {
        margin: 12px;
      }

      h1 {
        font-size: 24px;
      }

      .calendar {
        font-size: 12px;
      }

      .cell {
        min-height: 82px;
        padding: 4px;
      }

      .shift {
        font-size: 11px;
        padding: 2px 6px;
      }

      input[type="number"],
      input[type="date"] {
        width: 100%;
      }
    }
  </style>

  <script>
    (function () {
      const PASSWORD = "1223";
      const SESSION_KEY = "shiftCalendarAuth";

      if (sessionStorage.getItem(SESSION_KEY) === "ok") return;

      const input = prompt("パスワードを入力してください");
      if (input !== PASSWORD) {
        document.documentElement.innerHTML =
          "<head><meta charset='UTF-8'><title>アクセス不可</title></head>" +
          "<body style='font-family:Arial,sans-serif;padding:40px;background:#f5f5f5;'>" +
          "<h2>アクセスできません</h2><p>パスワードが違います。</p></body>";
        throw new Error("Unauthorized");
      }

      sessionStorage.setItem(SESSION_KEY, "ok");
    })();
  </script>
</head>
<body>

  <h1>交番表シフトカレンダー</h1>

  <div class="container">
    <div class="row">
      <div class="field">
        <label for="year">年</label>
        <input type="number" id="year">
      </div>

      <div class="field">
        <label for="month">月</label>
        <input type="number" id="month" min="1" max="12">
      </div>

      <div class="field">
        <label for="baseDate">基準日</label>
        <input type="date" id="baseDate">
      </div>

      <div class="field">
        <label for="startIndex">開始交番番号</label>
        <input type="number" id="startIndex" min="1">
      </div>
    </div>

    <div class="top-actions">
      <button onclick="generate()">カレンダー生成</button>
      <button class="success" onclick="exportIcs()">Yahooカレンダー用ICS出力</button>
      <button class="secondary" onclick="saveSettings()">設定を保存</button>
      <button class="secondary" onclick="resetSettings()">保存データを削除</button>
      <button class="secondary" onclick="logout()">再認証</button>
    </div>

    <div class="legend">
      <span><i class="dot dot-route"></i> 行路</span>
      <span><i class="dot dot-ake"></i> 行路継続（明け）</span>
      <span><i class="dot dot-off"></i> 休み</span>
    </div>

    <div class="notice">
      交番表は固定です。入力変更はできません。<br>
      設定はこの端末のブラウザに保存されます。
    </div>

    <div class="export-info">
      ICS出力では、その月の <strong>行路</strong> と <strong>明け</strong> だけを終日予定として出力します。<br>
      明け日は <strong>前日の行路名を継承して「○○（明け）」</strong> で出力します。<br>
      <strong>休みは出力しません。</strong>
    </div>

    <div class="pattern-preview" id="patternPreview"></div>

    <div class="summary" id="summary"></div>
    <div class="error" id="error"></div>
  </div>

  <div id="calendar"></div>

  <script>
    const STORAGE_KEY = "shiftCalendarSettings_final_v1";
    const AUTH_SESSION_KEY = "shiftCalendarAuth";

    const FIXED_PATTERN = [
      "17行路", "明け", "9行路", "明け", "休み", "休み",
      "24行路", "明け", "15行路", "明け", "休み", "休み",
      "8行路", "3行路", "18行路", "明け", "休み", "休み",
      "20行路", "明け", "16行路", "明け", "休み", "休み",
      "21行路", "明け", "10行路", "明け", "休み", "休み",
      "7行路", "4行路", "13行路", "明け", "休み", "休み",
      "26行路", "明け", "11行路", "明け", "休み", "休み",
      "25行路", "明け", "19行路", "明け", "休み", "休み",
      "6行路", "1行路", "23行路", "明け", "休み", "休み",
      "22行路", "明け", "12行路", "明け", "休み",
      "14行路", "明け", "5行路", "平2行路", "休み", "休み"
    ];

    function createLocalDateFromInput(value) {
      if (!value) return null;
      const parts = value.split("-").map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
      const [y, m, d] = parts;
      return new Date(y, m - 1, d);
    }

    function diffDaysLocal(date1, date2) {
      const msPerDay = 1000 * 60 * 60 * 24;
      const t1 = new Date(date1.getFullYear(), date1.getMonth(), date1.getDate()).getTime();
      const t2 = new Date(date2.getFullYear(), date2.getMonth(), date2.getDate()).getTime();
      return Math.round((t1 - t2) / msPerDay);
    }

    function classifyShift(shift) {
      if (shift === "明け") return "ake";
      if (shift.includes("休")) return "off";
      return "route";
    }

    function isRouteShift(shift) {
      return classifyShift(shift) === "route";
    }

    function isAkeShift(shift) {
      return classifyShift(shift) === "ake";
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDateForICS(date) {
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, "0");
      const dd = String(date.getDate()).padStart(2, "0");
      return `${yyyy}${mm}${dd}`;
    }

    function formatDateTimeStampUTC(date) {
      const yyyy = date.getUTCFullYear();
      const mm = String(date.getUTCMonth() + 1).padStart(2, "0");
      const dd = String(date.getUTCDate()).padStart(2, "0");
      const hh = String(date.getUTCHours()).padStart(2, "0");
      const mi = String(date.getUTCMinutes()).padStart(2, "0");
      const ss = String(date.getUTCSeconds()).padStart(2, "0");
      return `${yyyy}${mm}${dd}T${hh}${mi}${ss}Z`;
    }

    function addDays(date, days) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate() + days);
    }

    function saveSettings() {
      const payload = {
        year: document.getElementById("year").value,
        month: document.getElementById("month").value,
        baseDate: document.getElementById("baseDate").value,
        startIndex: document.getElementById("startIndex").value
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      alert("設定を保存しました。");
    }

    function loadSettings() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;

      try {
        const data = JSON.parse(raw);
        if (data.year) document.getElementById("year").value = data.year;
        if (data.month) document.getElementById("month").value = data.month;
        if (data.baseDate) document.getElementById("baseDate").value = data.baseDate;
        if (data.startIndex) document.getElementById("startIndex").value = data.startIndex;
        return true;
      } catch {
        return false;
      }
    }

    function resetSettings() {
      localStorage.removeItem(STORAGE_KEY);
      alert("保存データを削除しました。ページを再読込すると初期値に戻ります。");
    }

    function logout() {
      sessionStorage.removeItem(AUTH_SESSION_KEY);
      location.reload();
    }

    function renderPatternPreview() {
      const preview = document.getElementById("patternPreview");
      preview.textContent =
        "固定交番表（" + FIXED_PATTERN.length + "件）\n\n" +
        FIXED_PATTERN.map((item, index) => `${index + 1}. ${item}`).join("\n");
    }

    function getShiftForDate(current, baseDate, startIndex) {
      const diff = diffDaysLocal(current, baseDate);
      const index = ((startIndex + diff) % FIXED_PATTERN.length + FIXED_PATTERN.length) % FIXED_PATTERN.length;
      return FIXED_PATTERN[index];
    }

    function resolveDisplayForAke(result, currentIndex) {
      for (let i = currentIndex - 1; i >= 0; i--) {
        if (isRouteShift(result[i].rawShift)) {
          return {
            displayShift: result[i].displayShiftBase || result[i].rawShift,
            displayText: (result[i].displayShiftBase || result[i].rawShift) + "（明け）"
          };
        }
        if (classifyShift(result[i].rawShift) === "off") {
          break;
        }
      }
      return {
        displayShift: "明け",
        displayText: "明け"
      };
    }

    function collectMonthData(year, monthInput, baseDate, startIndexInput) {
      const month = monthInput - 1;
      const startIndex = startIndexInput - 1;
      const lastDate = new Date(year, month + 1, 0).getDate();
      const result = [];

      for (let d = 1; d <= lastDate; d++) {
        const current = new Date(year, month, d);
        const rawShift = getShiftForDate(current, baseDate, startIndex);
        const kind = classifyShift(rawShift);

        result.push({
          date: current,
          day: d,
          rawShift,
          kind,
          displayShiftBase: rawShift,
          displayText: rawShift,
          exportText: rawShift,
          note: ""
        });
      }

      for (let i = 0; i < result.length; i++) {
        const item = result[i];

        if (item.kind === "route") {
          item.displayShiftBase = item.rawShift;
          item.displayText = item.rawShift;
          item.exportText = item.rawShift;
          item.note = "";
        } else if (item.kind === "ake") {
          const resolved = resolveDisplayForAke(result, i);
          item.displayShiftBase = resolved.displayShift;
          item.displayText = resolved.displayText;
          item.exportText = resolved.displayText;
          item.note = "明け";
        } else {
          item.displayShiftBase = item.rawShift;
          item.displayText = item.rawShift;
          item.exportText = "";
          item.note = "";
        }
      }

      return result;
    }

    function generate() {
      const errorEl = document.getElementById("error");
      const summaryEl = document.getElementById("summary");
      const calendarEl = document.getElementById("calendar");

      errorEl.textContent = "";
      summaryEl.innerHTML = "";
      calendarEl.innerHTML = "";

      const year = parseInt(document.getElementById("year").value, 10);
      const monthInput = parseInt(document.getElementById("month").value, 10);
      const month = monthInput - 1;
      const baseDate = createLocalDateFromInput(document.getElementById("baseDate").value);
      const startIndexInput = parseInt(document.getElementById("startIndex").value, 10);
      const startIndex = startIndexInput - 1;

      if (!Number.isInteger(year) || !Number.isInteger(monthInput) || monthInput < 1 || monthInput > 12) {
        errorEl.textContent = "年または月が不正です。";
        return;
      }

      if (!baseDate) {
        errorEl.textContent = "基準日を正しく入力してください。";
        return;
      }

      if (!Number.isInteger(startIndexInput) || startIndexInput < 1) {
        errorEl.textContent = "開始交番番号は1以上で入力してください。";
        return;
      }

      if (startIndex >= FIXED_PATTERN.length) {
        errorEl.textContent = "開始交番番号が交番表の件数を超えています。";
        return;
      }

      const week = ["日", "月", "火", "水", "木", "金", "土"];
      const grid = document.createElement("div");
      grid.className = "calendar";

      for (const w of week) {
        const header = document.createElement("div");
        header.className = "cell header";
        header.textContent = w;
        grid.appendChild(header);
      }

      const firstDay = new Date(year, month, 1);
      const startDay = firstDay.getDay();
      const monthData = collectMonthData(year, monthInput, baseDate, startIndexInput);

      for (let i = 0; i < startDay; i++) {
        const blank = document.createElement("div");
        blank.className = "cell blank";
        grid.appendChild(blank);
      }

      let routeCount = 0;
      let akeCount = 0;
      let offCount = 0;
      let exportCount = 0;

      for (const item of monthData) {
        if (item.kind === "route") routeCount++;
        if (item.kind === "ake") akeCount++;
        if (item.kind === "off") offCount++;
        if (item.kind === "route" || item.kind === "ake") exportCount++;

        const cell = document.createElement("div");
        cell.className = "cell";

        const day = document.createElement("div");
        day.className = "day";
        day.textContent = item.day;

        const shiftLabel = document.createElement("div");
        shiftLabel.className = `shift ${item.kind}`;
        shiftLabel.textContent = item.displayText;

        cell.appendChild(day);
        cell.appendChild(shiftLabel);

        grid.appendChild(cell);
      }

      const startLabel = monthData.length > 0 ? monthData[0].displayText : FIXED_PATTERN[startIndex];

      summaryEl.innerHTML =
        `基準日 <strong>${escapeHtml(document.getElementById("baseDate").value)}</strong> は ` +
        `<strong>${escapeHtml(FIXED_PATTERN[startIndex])}</strong> を基準に計算しています。<br>` +
        `表示上の先頭勤務: <strong>${escapeHtml(startLabel)}</strong><br>` +
        `行路日数: <strong>${routeCount}</strong> 日 / ` +
        `明け日数: <strong>${akeCount}</strong> 日 / ` +
        `休日日数: <strong>${offCount}</strong> 日 / ` +
        `ICS出力件数: <strong>${exportCount}</strong> 件 / ` +
        `固定交番表件数: <strong>${FIXED_PATTERN.length}</strong> 件`;

      calendarEl.appendChild(grid);
    }

    function buildICS(monthData, year, monthInput) {
      const lines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Shift Calendar//JP",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH",
        "X-WR-CALNAME:シフト出力",
        "X-WR-TIMEZONE:Asia/Tokyo"
      ];

      const nowStamp = formatDateTimeStampUTC(new Date());

      for (const item of monthData) {
        if (!(item.kind === "route" || item.kind === "ake")) continue;

        const start = formatDateForICS(item.date);
        const end = formatDateForICS(addDays(item.date, 1));
        const uid = `${start}-${item.exportText}-${year}${String(monthInput).padStart(2, "0")}@shift-calendar`;

        lines.push("BEGIN:VEVENT");
        lines.push(`UID:${uid}`);
        lines.push(`DTSTAMP:${nowStamp}`);
        lines.push(`DTSTART;VALUE=DATE:${start}`);
        lines.push(`DTEND;VALUE=DATE:${end}`);
        lines.push(`SUMMARY:${item.exportText}`);
        lines.push("END:VEVENT");
      }

      lines.push("END:VCALENDAR");
      return lines.join("\r\n");
    }

    function downloadTextFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportIcs() {
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";

      const year = parseInt(document.getElementById("year").value, 10);
      const monthInput = parseInt(document.getElementById("month").value, 10);
      const baseDate = createLocalDateFromInput(document.getElementById("baseDate").value);
      const startIndexInput = parseInt(document.getElementById("startIndex").value, 10);

      if (!Number.isInteger(year) || !Number.isInteger(monthInput) || monthInput < 1 || monthInput > 12) {
        errorEl.textContent = "年または月が不正です。";
        return;
      }

      if (!baseDate) {
        errorEl.textContent = "基準日を正しく入力してください。";
        return;
      }

      if (!Number.isInteger(startIndexInput) || startIndexInput < 1 || startIndexInput > FIXED_PATTERN.length) {
        errorEl.textContent = "開始交番番号が不正です。";
        return;
      }

      const monthData = collectMonthData(year, monthInput, baseDate, startIndexInput);
      const exportTargetCount = monthData.filter(item => item.kind === "route" || item.kind === "ake").length;

      if (exportTargetCount === 0) {
        errorEl.textContent = "出力対象（行路・明け）がありません。";
        return;
      }

      const ics = buildICS(monthData, year, monthInput);
      const fileName = `shift_${year}_${String(monthInput).padStart(2, "0")}.ics`;
      downloadTextFile(fileName, ics, "text/calendar;charset=utf-8");
    }

    function setDefaultValues() {
      document.getElementById("year").value = 2026;
      document.getElementById("month").value = 3;
      document.getElementById("baseDate").value = "2026-03-14";
      document.getElementById("startIndex").value = 53;
    }

    setDefaultValues();
    loadSettings();
    renderPatternPreview();
    generate();
  </script>

</body>
</html>
